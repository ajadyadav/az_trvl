spring.application.name=aztrvl
spring.thymeleaf.cache=false

# ==========================================
# Nuitee liteAPI Configuration
# ==========================================
nuitee.api.key=sand_6c8ded42-2a54-466f-9824-62f83e2b1793
nuitee.api.base-url=https://api.liteapi.travel/v3.0
nuitee.default.nationality=IN
nuitee.default.currency=INR

# ==========================================
# H2 Embedded Database (Booking Storage)
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/aztrvl;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
