<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - AeroTravel</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="header-container">
            <a href="/" class="app-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <span class="logo-text">Aero<span>Travel</span></span>
            </a>
            <div class="header-actions">
                <a href="/" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </header>

    <!-- Auth Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <!-- Toggle Tabs -->
                <div class="auth-tabs">
                    <button class="auth-tab-btn active" onclick="switchAuthTab('login')">Login</button>
                    <button class="auth-tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
                </div>

                <!-- Login Form -->
                <div id="login-form-container" class="auth-form-container active">
                    <h2 class="auth-title">Welcome Back</h2>
                    <p class="auth-subtitle">Log in to manage your bookings and explore deals.</p>
                    
                    <form id="login-form" class="auth-form">
                        <div class="input-group">
                            <label for="login-email">Email Address</label>
                            <div class="input-with-icon">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="email" id="login-email" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="login-password">Password</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="login-password" placeholder="Enter your password" required>
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password')">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-actions">
                            <label class="remember-me">
                                <input type="checkbox" id="remember-me">
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="forgot-password">Forgot Password?</a>
                        </div>
                        <div id="login-error" class="error-message"></div>
                        <button type="submit" class="auth-submit-btn" id="login-btn">
                            <span class="btn-text">Log In</span>
                            <i class="fa-solid fa-spinner fa-spin loader-icon" style="display: none;"></i>
                        </button>
                    </form>
                    <div class="auth-divider">
                        <span>OR</span>
                    </div>
                    <button type="button" class="google-auth-btn" id="google-login-btn">
                        <i class="fa-brands fa-google"></i> Continue with Google
                    </button>
                </div>

                <!-- Signup Form -->
                <div id="signup-form-container" class="auth-form-container">
                    <h2 class="auth-title">Create an Account</h2>
                    <p class="auth-subtitle">Join AeroTravel for exclusive offers and faster bookings.</p>
                    
                    <form id="signup-form" class="auth-form">
                        <div class="input-group">
                            <label for="signup-name">Full Name</label>
                            <div class="input-with-icon">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" id="signup-name" placeholder="Enter your full name" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="signup-email">Email Address</label>
                            <div class="input-with-icon">
                                <i class="fa-regular fa-envelope"></i>
                                <input type="email" id="signup-email" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="signup-password">Password</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="signup-password" placeholder="Create a password" required minlength="6">
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signup-password')">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        <div class="input-group">
                            <label for="signup-phone">Phone Number</label>
                            <div class="input-with-icon">
                                <i class="fa-solid fa-phone"></i>
                                <input type="tel" id="signup-phone" placeholder="e.g. +919876543210" required>
                            </div>
                        </div>
                        <div id="signup-error" class="error-message"></div>
                        <button type="submit" class="auth-submit-btn" id="signup-btn">
                            <span class="btn-text">Sign Up</span>
                            <i class="fa-solid fa-spinner fa-spin loader-icon" style="display: none;"></i>
                        </button>
                    </form>
                    <div class="auth-divider">
                        <span>OR</span>
                    </div>
                    <button type="button" class="google-auth-btn" id="google-signup-btn">
                        <i class="fa-brands fa-google"></i> Sign Up with Google
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- UI Logic Script -->
    <script>
        function switchAuthTab(tab) {
            const loginForm  = document.getElementById('login-form-container');
            const signupForm = document.getElementById('signup-form-container');
            const tabButtons = document.querySelectorAll('.auth-tab-btn');

            tabButtons.forEach(btn => {
                if (btn.textContent.toLowerCase().includes(tab.replace('up', ' up'))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
            }
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>

    <!-- Firebase Auth Logic -->
    <script type="module" src="/js/firebase-config.js"></script>
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
